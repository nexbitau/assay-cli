[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assay-cli"
version = "0.1.0"
description = "What a training run costs, and what it would cost somewhere else."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["gpu", "training", "cost", "spot", "checkpoint", "finops", "mlops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Benchmark",
]
# No runtime dependencies, on purpose: a training box should not need to
# install a YAML parser to answer a cost question. PyYAML is used if present.
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8"]

[project.scripts]
assay = "assay.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/assay"]
