# A 7B fine-tune on 8×H100. Every field is something you can read off a
# training config, a provider price page, or one checkpoint's logs.
gpu_type: H100-SXM-80GB
gpu_count: 8
provider: provider-a
price_per_gpu_hour: 3.70
spot_price_per_gpu_hour: 1.45

step_time_sec: 1.84
target_steps: 600000
seq_len: 8192
global_batch: 256

checkpoint_write_sec: 135
checkpoint_interval_steps: 1533
restart_sec: 180

# The number nobody publishes. Leave it null and assay will show you the range
# your cost sits in, and what it is worth to measure.
preemptions_per_hour: null
